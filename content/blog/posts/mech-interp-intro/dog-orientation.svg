<svg xmlns="http://www.w3.org/2000/svg" width="640" height="380" viewBox="0 0 640 380" role="img" aria-labelledby="title desc">
<title id="title">Two dog-head pathways in a neural network</title><desc id="desc">A simplified neural network with three hidden layers of circular neurons and one output neuron that answers "Is this a dog?". In each hidden layer, a blue neuron detects left-facing dog heads and an ochre neuron detects right-facing dog heads. Each excites the same-orientation neuron in the next layer and, through dashed red connections ending in bars, inhibits the opposite-orientation neuron. Both pathways feed the output neuron. Faint grey neurons and connections show the rest of the network.</desc>
