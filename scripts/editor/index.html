<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Writing</title>
  <link rel="stylesheet" href="/typography.css">
  <link rel="stylesheet" href="/site-theme.css">
  <link rel="stylesheet" href="/editor.css">
  <script type="module" src="/editor.js"></script>
</head>
<body>
  <aside aria-label="Writing">
    <button id="new" type="button">New post</button>
    <nav id="posts" aria-label="Posts"></nav>
  </aside>
  <main>
    <header class="commands">
      <details id="settings">
        <summary>Post settings</summary>
        <div class="settings-fields">
          <label>URL<input id="slug" form="metadata" required placeholder="post-title" pattern="[a-z0-9]+(-[a-z0-9]+)*"></label>
          <label>Date<input id="date" form="metadata" type="date" required></label>
          <label>Status<select id="draft" form="metadata"><option value="true">Draft</option><option value="false">Ready to publish</option></select></label>
          <label>Description<input id="description" form="metadata" placeholder="Optional description"></label>
        </div>
      </details>
      <div class="save-status"><span id="status" role="status">Not saved</span><button id="save" type="button">Save post</button></div>
    </header>
    <form id="metadata"></form>
    <div class="toolbar" role="toolbar" aria-label="Formatting">
      <button type="button" data-format="bold" aria-label="Bold"><strong>B</strong></button>
      <button type="button" data-format="italic" aria-label="Italic"><em>I</em></button>
      <button type="button" data-format="heading">Heading</button>
      <button type="button" data-format="list">Bullets</button>
      <button type="button" data-format="ordered">Numbered list</button>
      <button type="button" data-format="link">Link</button>
      <button type="button" data-format="quote">Quote</button>
      <button type="button" data-format="code">Code</button>
      <button type="button" data-format="math">Equation</button>
      <button type="button" id="image">Image</button>
      <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden multiple>
    </div>
    <p id="error" role="alert" hidden></p>
    <section class="document" aria-label="Article">
      <input id="title" form="metadata" class="article-title" aria-label="Post title" required placeholder="Post title">
      <article id="body" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Article text" spellcheck="true" data-placeholder="Start writing…"></article>
    </section>
    <dialog id="insert-dialog">
      <form method="dialog" id="insert-form">
        <h2 id="insert-heading"></h2>
        <label id="insert-label-wrap">Text<input id="insert-label"></label>
        <label><span id="insert-value-label"></span><input id="insert-value" required></label>
        <label class="display-option" id="display-wrap"><input type="checkbox" id="display">Display on its own line</label>
        <p id="insert-error" role="alert" hidden></p>
        <div class="dialog-actions"><button type="button" id="insert-cancel">Cancel</button><button type="submit">Insert</button></div>
      </form>
    </dialog>
  </main>
</body>
</html>
